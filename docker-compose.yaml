version: "3.7"

networks:
  trx-db:
    driver: bridge

services:
  db:
    container_name: trx-db
    image: postgres:alpine
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin
      - POSTGRES_DB=db-transaction
    ports:
      - "6543:5432"
    networks:
      - trx-db



