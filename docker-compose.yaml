version: "3.7"

networks:
  trx-db:
    driver: bridge

services:
  db:
    container_name: trx-db
    image: postgres:alpine
    command: -c 'max_connections=500'
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin
      - POSTGRES_DB=db-transaction
    ports:
      - "6543:5432"
    volumes:
      - ./sql/products.sql:/docker-entrypoint-initdb.d/products.sql
      - ./sql/customers.sql:/docker-entrypoint-initdb.d/customers.sql
    networks:
      - trx-db

  redis:
    image: redis:alpine
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - trx-db



